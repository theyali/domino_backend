name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: domino-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker build
        run: docker build -t domino-backend-ci .

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to 185.229.225.177
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::GitHub secret SERVER_PASSWORD is not configured"
            exit 1
          fi

          sshpass -e ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@185.229.225.177 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if ! command -v git >/dev/null 2>&1 || \
             ! command -v curl >/dev/null 2>&1 || \
             ! command -v openssl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git curl ca-certificates openssl
          fi

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi

          if ! docker compose version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker-compose-plugin
          fi

          if command -v systemctl >/dev/null 2>&1; then
            systemctl enable --now docker || true
          fi

          if command -v ufw >/dev/null 2>&1; then
            ufw allow 80/tcp || true
          fi

          if [ -d /opt/domino_backend/.git ]; then
            cd /opt/domino_backend
            echo "=== Recent backend logs before deploy ==="
            docker compose logs --since=45m --tail=400 web || true
            echo "=== End recent backend logs ==="
          fi

          if [ ! -d /opt/domino_backend/.git ]; then
            rm -rf /opt/domino_backend
            git clone --branch main --depth 1 \
              https://github.com/theyali/domino_backend.git \
              /opt/domino_backend
          else
            cd /opt/domino_backend
            git fetch origin main
            git reset --hard origin/main
          fi

          cd /opt/domino_backend
          mkdir -p data/postgres

          if [ ! -f .env ]; then
            DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
            POSTGRES_PASSWORD="$(openssl rand -hex 32)"

            cat > .env <<ENV
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_DEBUG=1
          DJANGO_ALLOWED_HOSTS=185.229.225.177,127.0.0.1,localhost

          DJANGO_SUPERUSER_USERNAME=admin
          DJANGO_SUPERUSER_PASSWORD=admin
          DJANGO_SUPERUSER_EMAIL=admin@localhost

          POSTGRES_DB=domino
          POSTGRES_USER=domino
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

          PGBOUNCER_HOST_PORT=6433
          REDIS_HOST_PORT=6380
          WEB_BIND=0.0.0.0
          WEB_PORT=80
          DOCKER_SUBNET=172.30.240.0/24

          DB_CONN_MAX_AGE=0
          DB_DISABLE_SERVER_SIDE_CURSORS=1
          ENV

            chmod 600 .env
          fi

          set_env_var() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_env_var WEB_BIND 0.0.0.0
          set_env_var WEB_PORT 80
          set_env_var DJANGO_ALLOWED_HOSTS 185.229.225.177,127.0.0.1,localhost
          set_env_var DJANGO_SUPERUSER_USERNAME admin
          set_env_var DJANGO_SUPERUSER_PASSWORD admin
          set_env_var DJANGO_SUPERUSER_EMAIL admin@localhost

          docker compose pull db pgbouncer redis
          docker compose up -d --build --remove-orphans
          docker compose ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1/api/health/ >/dev/null; then
              echo "Domino backend is healthy locally."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend local health check failed"
              docker compose logs --tail=200 web
              exit 1
            fi
            sleep 2
          done

          docker compose exec -T web python manage.py check </dev/null
          docker compose exec -T web python manage.py makemigrations --check --dry-run </dev/null

          echo "Checking global gift purchase/send flow..."
          docker compose exec -T web python manage.py shell <<'PY'
          from decimal import Decimal
          from uuid import uuid4

          from django.contrib.auth import get_user_model
          from rest_framework.test import APIClient

          from gifts.models import Gift, GiftPurchase, InventoryGift
          from restaurants.models import Restaurant
          from rooms.models import GameRoom, RoomPlayer

          suffix = uuid4().hex[:10]
          User = get_user_model()
          sender = recipient = restaurant = room = gift = None

          try:
              sender = User.objects.create_user(username=f"gift_smoke_sender_{suffix}")
              recipient = User.objects.create_user(username=f"gift_smoke_recipient_{suffix}")
              restaurant = Restaurant.objects.create(name=f"Gift smoke {suffix}")
              room = GameRoom.objects.create(
                  restaurant=restaurant,
                  name=f"Smoke {suffix}",
                  owner_name=sender.username,
                  max_players=2,
                  status=GameRoom.Status.PLAYING,
              )
              sender_player = RoomPlayer.objects.create(
                  room=room,
                  user=sender,
                  name=sender.username,
                  seat_index=0,
                  is_owner=True,
              )
              recipient_player = RoomPlayer.objects.create(
                  room=room,
                  user=recipient,
                  name=recipient.username,
                  seat_index=1,
              )
              gift = Gift.objects.create(
                  restaurant=None,
                  name=f"Global smoke gift {suffix}",
                  price=Decimal("99.00"),
                  level=5,
              )

              client = APIClient()
              client.force_authenticate(user=sender)

              catalog = client.get(f"/api/restaurants/{restaurant.id}/gifts/")
              assert catalog.status_code == 200, catalog.content
              catalog_ids = {item["id"] for item in catalog.json()}
              assert gift.id in catalog_ids, catalog.content

              purchase = client.post(
                  f"/api/restaurants/{restaurant.id}/gifts/{gift.id}/purchase/",
                  {"quantity": 2},
                  format="json",
              )
              assert purchase.status_code == 200, purchase.content

              sent = client.post(
                  f"/api/rooms/{room.id}/gifts/send/",
                  {
                      "gift_id": gift.id,
                      "recipient_player_ids": [
                          sender_player.id,
                          recipient_player.id,
                      ],
                  },
                  format="json",
              )
              assert sent.status_code == 200, sent.content
              payload = sent.json()
              assert payload["gift"]["is_global"] is True, payload
              assert payload["gift"]["level"] == 5, payload

              sender_player.refresh_from_db()
              recipient_player.refresh_from_db()
              assert sender_player.active_gift_id == gift.id
              assert recipient_player.active_gift_id == gift.id

              received_items = InventoryGift.objects.filter(
                  gift=gift,
                  is_giftable=False,
              )
              assert received_items.filter(owner=sender, gifted_by=sender).exists()
              assert received_items.filter(owner=recipient, gifted_by=sender).exists()

              print("Global gift purchase/send smoke check passed.")
          finally:
              if gift is not None:
                  InventoryGift.objects.filter(gift=gift).delete()
                  GiftPurchase.objects.filter(gift=gift).delete()
              if room is not None:
                  room.delete()
              if gift is not None:
                  gift.delete()
              if restaurant is not None:
                  restaurant.delete()
              if sender is not None:
                  sender.delete()
              if recipient is not None:
                  recipient.delete()
          PY

          echo "Checking idle Channels receive for Redis timeout regression..."
          docker compose exec -T web python manage.py shell <<'PY'
          import asyncio
          from channels.layers import get_channel_layer

          async def check_channel_layer():
              layer = get_channel_layer()
              channel = await layer.new_channel("health")

              async def delayed_send():
                  await asyncio.sleep(8)
                  await layer.send(channel, {"type": "health.message"})

              sender = asyncio.create_task(delayed_send())
              try:
                  message = await asyncio.wait_for(layer.receive(channel), timeout=12)
                  assert message.get("type") == "health.message", message
              finally:
                  await sender

          asyncio.run(check_channel_layer())
          print("Channels Redis idle receive smoke check passed.")
          PY
          REMOTE

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              http://185.229.225.177/api/health/ >/dev/null; then
              echo "Domino backend is publicly healthy: http://185.229.225.177/"
              exit 0
            fi
            sleep 2
          done

          echo "Public health check failed"
          exit 1
