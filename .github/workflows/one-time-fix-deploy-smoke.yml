name: One-time fix deploy smoke

on:
  push:
    paths:
      - .github/workflows/one-time-fix-deploy-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch deploy workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          replacements = {
              'docker compose exec -T web python manage.py check\n':
                  'docker compose exec -T web python manage.py check </dev/null\n',
              'docker compose exec -T web python manage.py makemigrations --check --dry-run\n':
                  'docker compose exec -T web python manage.py makemigrations --check --dry-run </dev/null\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/one-time-fix-deploy-smoke.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Run deploy smoke tests without consuming SSH stdin'
          git push
